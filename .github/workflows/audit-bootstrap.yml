name: Release audit workspace
on:
  push:
    branches: [release/final-production-pass]
    paths: [.github/workflows/audit-bootstrap.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save @supabase/ssr @supabase/supabase-js eslint eslint-config-next @testing-library/react jsdom @axe-core/playwright
      - name: Bundle source and dependencies for offline verification
        run: |
          git archive HEAD -o /tmp/spinout-source.tar
          tar -czf /tmp/spinout-runtime.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-workspace
          path: |
            /tmp/spinout-source.tar
            /tmp/spinout-runtime.tgz
          retention-days: 2
          compression-level: 0
