name: CI

on:
  push:
    branches: [main, 'rebuild/**', 'release/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://vwjaoibxjklaepfllenk.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MdPVpbAl0W7UQYlZy_lo6A_QQMX1pQW
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser QA
        run: |
          npm start > /tmp/spinout-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          npm run qa
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spin-out-qa
          path: |
            qa-artifacts
            /tmp/spinout-next.log
          if-no-files-found: ignore
