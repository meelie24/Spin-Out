</style></head><body><div id="app"></div><noscript>Spin Out needs JavaScript to run a session. No money is involved. Gambling-style play may increase urges.</noscript><script>(()=>{'use strict';const C=(()=>{/** Fixed simulated-credit rules. No money, adaptive odds or outcome telemetry. */

 'losing-run':neutral,neutral,
 'due-for-a-win':{question:'Does part of you feel like a win should be coming?',choices:[['yeah','Yeah'],['a-little','A little'],['no','No']]},
 'after-win':{question:'If this were real money, what would you probably do right now?',choices:[['take-it','Take it and leave'],['keep-going','Keep going'],['not-sure',"I'm not sure"]]},
 'balance-up':{question:"You're up. Would this normally make leaving easier?",choices:[['yeah','Yeah'],['no','No'],['keep-going',"I'd probably keep going"]]}
};
const FACES={
 '-10':['lemon','bell','plum','gem','cherry'],
 '-5':['cherry','lemon','plum','gem','bell'],
 '0':['cherry','cherry','lemon','plum','gem'],
 '10':['bell','bell','bell','lemon','plum'],
 '30':['seven','seven','seven','seven','seven']
};
function symbolGrid(net){
 const center=[...(FACES[String(net)]||FACES['-10'])];
 // Five DIFFERENT symbols in each contextual row. No staged near-jackpot line.
 const ring=net>0?['gem','cherry','bell','lemon','plum','seven']:['gem','cherry','bell','lemon','plum'];
 const offset=net===-5?2:net===0?3:net===10?1:0;

 <div class="panel-actions">${link('/help','Get help',`button ${risk?'primary':''}`)}${button('close','Close Spin Out','button')}</div><p class="age">Next session available in <span data-clock>${timeText(remaining())}</span>. Expired answers clear while the site is open, or on your next visit.</p></section></main>`;
}
function prose(title,body){return `<main id="main"><article class="prose"><h1 tabindex="-1">${title}</h1>${body}</article></main>${footer()}`;}
function help(){
 const local=region==='gb'?`<h2>Great Britain</h2><p>${external('https://www.gamcare.org.uk/','GamCare')} offers gambling support. ${external('https://www.gamstop.co.uk/','GAMSTOP')} is an online self-exclusion service. Check each provider's eligibility.</p>`:region==='us'?`<h2>United States</h2><p>${external('https://www.ncpgambling.org/help-treatment/help-by-state/','Find gambling support by state')} through the National Council on Problem Gambling.</p>`:region?'<p>No local phone number is listed here. The international services below can help you look for support in your country.</p>':'';
 return prose("If Spin Out isn't enough right now",`<p>There are stronger ways to put distance between you and gambling.</p><label for="region">Choose your location</label><select id="region"><option value="">Choose your location</option>${[['bs','The Bahamas'],['us','United States'],['gb','Great Britain'],['other','Other location']].map(([v,t])=>`<option value="${v}" ${region===v?'selected':''}>${t}</option>`).join('')}</select>${local}<h2>Talk to someone</h2><p>${external('https://gamblingtherapy.org/talk-to-us/','Gambling Therapy')} offers international online emotional support and practical advice. It isn't a local emergency service.</p><h2>Block access</h2><p>${external('https://betblocker.org/','BetBlocker')} and ${external('https://gamban.com/','Gamban')} are gambling blocking tools. Provider terms and availability apply; Gamban may require payment.</p><h2>Exclude yourself and limit payments</h2><p>Check self-exclusion options with the relevant operator or regulator. Ask your bank whether it offers a gambling payment block. Availability varies.</p><h2>Immediate danger</h2><p>Contact your local emergency services. ${external('https://findahelpline.com/','Find A Helpline')} is a country-selectable support directory, not a gambling treatment service.</p>`);
}
function research(){
 return prose('Why Spin Out works this way',`<p>Spin Out has not been clinically tested. The studies below explain related design questions; they do not show that this website treats gambling problems.</p>
 <details><summary>Chasing losses and random outcomes</summary><p>Losing can make leaving harder. A run of losses does not make the next independent Spin Out result more likely to win.</p><p class="source">${external('https://pmc.ncbi.nlm.nih.gov/articles/PMC2827449/','Luke Clark (2010): Decision-making during gambling')} reviews gambling-related thinking and beliefs about randomness.</p></details>
 <details><summary>Questions during play</summary><p>Self-appraisal messages have been studied with online gamblers. Their effects are mixed and context-dependent; some people find messages irritating.</p><p class="source">${external('https://pubmed.ncbi.nlm.nih.gov/34366941/','Impact of Warning Pop-Up Messages on Gambling Behavior, Craving, and Cognitions (2021)')}.</p></details>
 <details><summary>Breaks are not automatically helpful</summary><p>A simulated-blackjack study found that imposed breaks increased craving. A study on a gambling platform found longer voluntary pauses during longer mandatory-break conditions, with most positive effects diminishing afterward.</p><p class="source">${external('https://pubmed.ncbi.nlm.nih.gov/26275785/','Breaks in Play: Do They Achieve Intended Aims?')} and ${external('https://doi.org/10.1007/s11469-022-00996-7','Cooling Off and the Effects of Mandatory Breaks in Online Gambling')}.</p><p>Twenty spins and a 15-minute pause are product limits, not proven therapeutic doses.</p></details>
 <details><summary>Gambling cues carry risk</summary><p>Gambling-style imagery can increase the urge to gamble. That risk is stated before play, with a high-urge warning and readily available help.</p><p class="source">${external('https://pubmed.ncbi.nlm.nih.gov/27804002/','Cue-Reactive Urge to Gamble in Poker-Machine Gamblers')} studied gambling and neutral video cues in a small sample.</p></details>
 <details><summary>Online treatment is different</summary><p>Research on structured internet-delivered psychological treatments cannot establish the effectiveness of this short spin exercise.</p><p class="source">${external('https://pubmed.ncbi.nlm.nih.gov/34546971/','Internet-based treatment of gambling problems: systematic review and meta-analysis (2021)')}.</p></details><p>${link('/help','Get help')}</p>`);
}
function privacy(){return prose('Privacy',`<p>No account or payment details are needed. This version does not add analytics, advertising pixels or external font requests.</p><h2>What stays in your browser</h2><p>Your session balance, spin history, trigger and urge ratings are stored on this device so a refresh can restore the session. They are not sent to a server by this application. A sound preference may remain.</p><h2>When answers are removed</h2><p>Ended-session details clear after the 15-minute pause while the site is running, or when you next open it. A closed tab cannot delete stored information while no code is running.</p><h2>Shared devices and local controls</h2><p>Other people using this browser may see saved information. You can remove it through your browser's site-data settings. Deleting site data or changing browsers can bypass the local cooldown; it is not a security boundary.</p><h2>Hosting and outside services</h2><p>A hosting provider may process basic connection logs and aggregate traffic information. External support and research links have their own privacy policies. The downloadable local version makes no network requests until you follow an external link.</p>`);}
function terms(){return prose('Terms',`<p>Spin Out is for adults aged 18 or older. It is a voluntary simulated-credit exercise, not a medical or emergency service.</p><h2>No money or prizes</h2><p>Credits have no monetary value. They cannot be purchased, transferred or redeemed. No deposits, cash-outs or prizes are available.</p><h2>No proven treatment claim</h2><p>Spin Out has not been clinically tested as a treatment. Gambling-style play may increase urges. Stop using it if it makes things worse and consider professional support.</p><h2>Session rules</h2><p>The ${link('/credits','credit rules')} explain the fixed odds and displayed results. Each session is capped at 20 spins and followed by a 15-minute pause stored in this browser.</p><h2>Practical limits</h2><p>Browser storage can fail or be deleted. Support providers are independent and their availability varies. This site does not guarantee the availability or suitability of an external service.</p>`);}
function render(){
 cleanup();const path=currentRoute();
 document.body.className=path==='/play'?'play-page':'';
 let body;
 if(path==='/')body=home();
 else if(path==='/play')body=playScreen();
 else if(path==='/help')body=help();
 else if(path==='/research')body=research();
 else if(path==='/privacy')body=privacy();
 else if(path==='/terms')body=terms();
 else if(path==='/credits')body=prose('How credits work',odds());
 else body=prose('Page not found',`<p>${link('/','Back to Spin Out')} or ${link('/help','get help')}.</p>`);
 mount.innerHTML=`<a class="skip" href="#main">Skip to content</a>${topbar()}${notice?`<p class="global-notice" role="status">${esc(notice)}</p>`:''}${body}`;
 document.title=path==='/'?'Spin Out | Learn how to leave.':`Spin Out | ${path.slice(1)||'Home'}`;
}
async function begin(){
 if(transactionPending)return;
 transactionPending=true;spinError='';
 try{
  await transact(e=>{
   if(e.session||e.cooldownUntil>Date.now())return null;
   const session=C.createSession(setup.urge,setup.trigger);
   return {...e,session};
  });
  highWarning=false;render();window.scrollTo(0,0);
 }catch{spinError="The session couldn't start. Your credits haven't changed. Try again.";render();}
 finally{transactionPending=false;}
}
let audio;
function tone(){
 if(!env.sound)return;
 try{
  audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();
  const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=260;
  gain.gain.setValueAtTime(.028,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);
  osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.075);
 }catch{/* Optional sound failure does not affect gameplay. */}
}
async function takeSpin(){
 if(transactionPending||localBusy||localClosing)return;
 transactionPending=true;spinError='';let committed=null;
 try{
  await transact(e=>{
   if(!C.canSpin(e.session))return null;
   const next=C.spin(e.session,C.random,Date.now());committed={id:next.id,count:next.spinCount};
   return {...e,session:next,cooldownUntil:next.until??0};
  });
  if(committed){
   localBusy=!reduced.matches;tone();render();
   timer=setTimeout(async()=>{
    localBusy=false;
    await transact(e=>e.session?.id===committed.id&&e.session.spinCount===committed.count?{...e,session:C.settle(e.session)}:null);
    render();
    if(env.session?.phase==='checkin')document.getElementById('checkin-heading')?.focus({preventScroll:true});
    else if(env.session?.phase==='playing')document.querySelector('[data-action="spin"]')?.focus({preventScroll:true});
    else document.querySelector('h1')?.focus({preventScroll:true});
   },reduced.matches?0:1000);
  }else render();
 }catch{spinError="That spin didn't go through. Your credits haven't changed. Try again.";render();}
 finally{transactionPending=false;}
}
async function endNow(){
 localClosing=true;cancelAnimation();
 try{
  await transact(e=>{
   if(!e.session)return null;
   const next=C.end(e.session,Date.now());return {...e,session:next,cooldownUntil:next.until};
  });
 }finally{localClosing=false;render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true});}
}
mount.addEventListener('click',async event=>{
 const nav=event.target.closest('a[data-route]');
 if(nav){if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();navigate(nav.dataset.route);return;}
 const el=event.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action;
 if(action==='trigger'){
  setup.trigger=el.dataset.trigger;
  document.querySelectorAll('[data-action="trigger"]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.trigger===setup.trigger)));
  document.querySelector('#setup-form button[type="submit"]').disabled=false;
 }else if(action==='spin')await takeSpin();
 else if(action==='end')await endNow();
 else if(action==='answer'){
  await transact(e=>e.session?{...e,session:C.answer(e.session,el.dataset.answer)}:null);render();document.querySelector('[data-action="resume"]')?.focus({preventScroll:true});
 }else if(action==='resume'){
  await transact(e=>e.session?{...e,session:C.resume(e.session)}:null);render();document.querySelector('[data-action="spin"]')?.focus({preventScroll:true});
 }else if(action==='accept-high')await begin();
 else if(action==='back-setup'){highWarning=false;render();}
 else if(action==='sound'){
  await transact(e=>({...e,sound:!e.sound}));el.setAttribute('aria-pressed',String(env.sound));el.textContent=env.sound?'Sound on':'Sound off';
 }else if(action==='close'){closed=true;cancelAnimation();render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true});}
});
mount.addEventListener('submit',async event=>{
 event.preventDefault();
 if(event.target.id==='setup-form'){
  if(!setup.trigger)return;
  read();
  if(env.session||remaining()>0){render();return;}
  if(setup.urge>=9){highWarning=true;render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true});}
  else await begin();
 }else if(event.target.id==='after-form'){
  await transact(e=>e.session?{...e,session:C.rate(e.session,afterUrge)}:null);render();
 }
});
mount.addEventListener('input',event=>{
 const el=event.target;
 if(el.id==='before')setup.urge=Number(el.value);
 if(el.id==='after')afterUrge=Number(el.value);
 if(['before','after'].includes(el.id))el.parentElement.querySelector('output').textContent=el.value;
});
mount.addEventListener('change',event=>{if(event.target.id==='region'){region=event.target.value;render();document.getElementById('region')?.focus({preventScroll:true});}});
mount.addEventListener('keydown',event=>{
 if(event.repeat&&event.target.closest('[data-action="spin"]')){event.preventDefault();return;}
 if(event.target.matches('[role="radio"]')&&['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(event.key)){
  event.preventDefault();const radios=[...document.querySelectorAll('[role="radio"]')];
  const direction=['ArrowRight','ArrowDown'].includes(event.key)?1:-1;
  radios[(radios.indexOf(event.target)+direction+radios.length)%radios.length].focus();
 }
});
window.addEventListener('popstate',()=>{closed=false;read();render();});
window.addEventListener('hashchange',()=>{closed=false;read();render();});
window.addEventListener('storage',event=>{
 if(event.key!==KEY&&event.key!==null)return;
 const old=env.session;read();
 if(!env.session||env.session.id!==old?.id||env.session.phase==='ended')cancelAnimation();
 render();
});
setInterval(()=>{
 const old=env.cooldownUntil;cleanup();
 document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=timeText(remaining()));
 if(old&&env.cooldownUntil===0)render();
},1000);
read();
if(env.session?.animating){env.session=C.settle(env.session);persist();}
render();

})();</script></body></html>
